name: Apply QR scanner upgrade

on:
  push:
    branches:
      - agent/qr-scanner-upgrade
    paths:
      - '.github/workflows/apply-qr-scanner-upgrade.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/qr-scanner-upgrade
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply scanner wiring
        run: node scripts/apply-qr-scanner-upgrade.mjs
      - name: Commit scanner wiring
        run: |
          git config user.name "John Mark"
          git config user.email "88698057+jmqbataller@users.noreply.github.com"
          git add src/App.tsx src/data-tools.ts package.json
          git commit -m "Upgrade QR and barcode scanner"
          git push origin HEAD:agent/qr-scanner-upgrade
