name: Apply Deskora QA fixes

on:
  push:
    branches:
      - agent/full-tool-qa
    paths:
      - '.github/workflows/apply-full-tool-qa.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/full-tool-qa
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repair one-shot patch script quoting
        run: sed -i '63c# QR payload escaping is handled by the dedicated Wi-Fi QR tools.' scripts/apply-qa-fixes.py
      - name: Apply QA fixes
        run: python scripts/apply-qa-fixes.py
      - name: Keep workflow files out of runner commit
        run: |
          git checkout -- .github/workflows/ci.yml
          git checkout -- .github/workflows/apply-full-tool-qa.yml
      - name: Commit QA fixes
        run: |
          git config user.name "John Mark"
          git config user.email "88698057+jmqbataller@users.noreply.github.com"
          git add -A
          git commit -m "QA harden all Deskora tools"
          git push origin HEAD:agent/full-tool-qa
